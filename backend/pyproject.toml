[project]
name = "teamplus-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() 기본값 패턴 허용

[tool.ruff.lint.per-file-ignores]
# 프롬프트 원문은 줄바꿈하면 내용이 바뀌므로 줄 길이 검사 제외
"app/ai/prompts.py" = ["E501"]
